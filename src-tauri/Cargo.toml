[package]
name = "sistema-muebles-san-pablo"
version = "1.26.0"
description = "Sistema de cobro para Muebles San Pablo"
authors = ["Muebles San Pablo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sha2 = "0.10"

# Repintado del WebView al despertar o cambiar de pantalla (src/repintado.rs).
# Mismas versiones que ya arrastra tauri/wry; sólo se activan las features
# que hacen falta para observar NSWorkspace/NSApplication y tocar el NSView.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSApplication", "NSResponder", "NSView"] }

[features]
# Habilita el inspector (devtools del WebView) en builds release.
# Solo el build de TEST lo activa con `--features devtools`; prod (CI release.yml)
# NO lo pasa, así que queda compilado-fuera en producción.
devtools = ["tauri/devtools"]

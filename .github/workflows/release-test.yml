name: Release Test

# Compila el build de PRUEBA (config src-tauri/tauri.test.conf.json → apunta a
# apidev/apidb vía .env.test) en un runner Windows y publica un release DRAFT
# (el auto-updater de prod solo ve releases *published* del canal `latest`, así
# que esto no afecta a producción). Los testers bajan el instalador a mano.
#
# Se dispara empujando un tag `v*-test*` (p.ej. v1.13.2-test.2) o manualmente.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-test*'

jobs:
  release-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # Solo NSIS: el MSI/WiX exige prerelease numérico (1.13.2-test.2 lo
            # rompe) y NSIS es el canal que prefiere el updater.
            args: '--config src-tauri/tauri.test.conf.json --bundles nsis'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the TEST app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v1.13.2-test.2
          releaseName: 'Sistema Muebles San Pablo TEST v1.13.2-test.2'
          releaseBody: 'Build de PRUEBA (apidev/apidb). Instalable junto al de producción. NO publicar al canal de prod.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
